app = "retro-loop"        # must equal the name given to `fly apps create`
primary_region = "lhr"    # must equal the region of the volume

[mounts]
  source = "data"
  destination = "/data"   # the directory of RETRO_DB in the Dockerfile

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # a stopped machine drops every socket mid-retro
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
